<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | 540games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #0f0f1a;
      color: #e0e0f0;
      line-height: 1.8;
    }
    header {
      background: #1a1a2e;
      border-bottom: 2px solid #00ffcc;
      padding: 16px 24px;
    }
    header a {
      color: #00ffcc;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
    }
    header a:hover { color: #fff; }
    .container {
      max-width: 600px;
      margin: 48px auto;
      padding: 0 24px 64px;
    }
    h1 {
      font-size: 2rem;
      color: #00ffcc;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #888;
      margin-bottom: 40px;
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #00ffcc;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }
    input, textarea, select {
      width: 100%;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 12px 16px;
      color: #e0e0f0;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #00ffcc;
    }
    textarea { height: 160px; resize: vertical; }
    select option { background: #1a1a2e; }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #00ffcc;
      color: #0f0f1a;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background 0.2s;
    }
    .submit-btn:hover { background: #00ddaa; }
    .note {
      margin-top: 24px;
      font-size: 0.85rem;
      color: #666;
    }
    footer {
      text-align: center;
      padding: 24px;
      color: #555;
      font-size: 0.8rem;
      border-top: 1px solid #1a1a2e;
    }
    a { color: #00ffcc; }
  </style>
</head>
<body>

<header>
  <a href="index.html">🎮 540GAMES</a>
</header>

<div class="container">
  <h1>お問い合わせ</h1>
  <p class="subtitle">バグ報告・ご意見・ご感想など、お気軽にどうぞ。</p>

  <form action="https://formspree.io/f/mgobboyj" method="POST">
    <div class="form-group">
      <label for="name">お名前</label>
      <input type="text" id="name" name="name" placeholder="例：山田 太郎" required>
    </div>

    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" placeholder="例：example@email.com" required>
    </div>

    <div class="form-group">
      <label for="category">お問い合わせ種別</label>
      <select id="category" name="category">
        <option value="bug">バグ・不具合報告</option>
        <option value="feedback">ご意見・ご感想</option>
        <option value="other">その他</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message">メッセージ</label>
      <textarea id="message" name="message" placeholder="お問い合わせ内容をご記入ください。" required></textarea>
    </div>

    <button type="submit" class="submit-btn">送信する</button>
  </form>

  <p class="note">
    ※ 返信には数日かかる場合があります。<br>
    ※ 個人情報は<a href="privacy.html">プライバシーポリシー</a>に基づき適切に管理します。
  </p>
</div>

<footer>
  &copy; 2026 540games. All rights reserved.
</footer>

</body>
</html>
